
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Ludo Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial}
header{text-align:center;padding:25px;background:#1b2850}
h1{color:#ffd34e}
nav{display:flex;justify-content:center;gap:18px;padding:18px;background:#080e20}
nav a{color:white;text-decoration:none}
.hero{text-align:center;padding:45px 15px}
.card{background:#202d50;padding:22px;margin:18px auto;border-radius:12px;max-width:500px}
button{background:#ffd34e;border:0;padding:13px 22px;border-radius:8px;font-weight:bold}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>🎲 MONEY LUDO PLAYER</h1>
<p>Play • Compete • Enjoy</p>
</header>
<nav>
<a href="#home">Home</a>
<a href="#games">Games</a>
<a href="#account">Account</a><a href="#wallet">Wallet</a>
</nav>
<section class="hero" id="home">
<h2>Welcome to Money Ludo Player</h2>
<p>Your Ludo Gaming Community</p>
</section>
<section class="card" id="games">
<h2>🎮 Ludo Games</h2>
<p>Game information and schedules</p>
<button>View Games</button>
</section>

<section class="card" id="wallet">
  <h2>💰 My Wallet</h2>
  <h3>Balance: ₹<span id="balance">0.00</span></h3>
  <input type="number" id="amount" placeholder="Enter amount">
  <button onclick="addCash()">Add Cash</button>
  <button onclick="withdrawCash()">Withdrawal</button>
  <h3>Transaction History</h3>
  <ul id="history"></ul>
</section>
  <section class="card" id="classic-ludo">
  <h2>🎲 Classic Ludo</h2>
  <p>Play Classic Ludo with friends!</p>
  <button onclick="alert('Classic Ludo coming soon!')">
    Play Classic Ludo
  </button>
  </section>
<footer> </footer>
<script>
let balance = 0;

function updateBalance() {
  document.getElementById("balance").textContent =
    balance.toFixed(2);
}

function addHistory(type, amount) {
  let item = document.createElement("li");
  item.textContent = type + " - ₹" + amount.toFixed(2);
  document.getElementById("history").prepend(item);
}

function addCash() {
  let amount = Number(document.getElementById("amount").value);

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Enter valid amount");
    return;
  }

  balance += amount;
  updateBalance();
  addHistory("Demo Cash Added", amount);
}

function withdrawCash() {
  let amount = Number(document.getElementById("amount").value);

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Enter valid amount");
    return;
  }

  if (amount > balance) {
    alert("Insufficient demo balance");
    return;
  }

  balance -= amount;
  updateBalance();
  addHistory("Demo Withdrawal", amount);
}
</script>
  
</body> 
</html>
